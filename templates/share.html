<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Delivery | {{ site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            user-select: none;
        }
        .portal-card {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.8), rgba(3, 7, 18, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 44px 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            text-align: center;
        }
        .brand-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .icon-circle svg { width: 30px; height: 30px; fill: #38bdf8; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
        .pw-input {
            width: 100%;
            padding: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 16px;
            text-align: center;
            transition: all 0.2s;
        }
        .pw-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 12px; display: none; }

        /* Unlocked Content State */
        #unlockedSection { display: none; }
        .preview-container { margin: 20px 0; border-radius: 12px; overflow: hidden; background: #000; max-height: 250px; display: flex; align-items: center; justify-content: center; border: 1px solid #1e293b; }
        .preview-container img, .preview-container video { width: 100%; max-height: 250px; object-fit: contain; }
        .item-info { background: #0b1120; border-radius: 12px; padding: 16px; margin-bottom: 24px; font-size: 13px; color: #cbd5e1; border: 1px solid #1e293b; }
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.2s;
        }
        .download-btn:hover { opacity: 0.95; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="brand-badge">{{ site_name }}</div>

        <!-- Locked Screen -->
        <div id="lockedSection">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <h1>Protected Asset</h1>
            <p class="subtitle">Enter the password provided for this link to unlock.</p>
            <input type="password" id="passInput" class="pw-input" placeholder="e.g. aoudfnegcu" autocomplete="off">
            <button class="btn-submit" onclick="unlockItem()">Verify & Open</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- Unlocked Screen -->
        <div id="unlockedSection">
            <h1>Asset Ready</h1>
            <p class="subtitle">Access verified. Your file is ready for download.</p>
            
            <div id="mediaPreview" class="preview-container" style="display: none;"></div>

            <div class="item-info">
                <div id="fileName" style="font-weight: 700; margin-bottom: 6px; font-size: 14px;"></div>
                <div id="fileMeta" style="color: #94a3b8;"></div>
            </div>

            <a id="actionDownloadBtn" class="download-btn" href="#" target="_blank">Download File</a>
        </div>
    </div>

    <script>
        // Anti-Inspect / Disable F12 & Shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
               (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };

        const currentLinkCode = "{{ link_code }}";

        function unlockItem() {
            const password = document.getElementById('passInput').value.trim();
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            if (!password) {
                err.innerText = "Please enter the password.";
                err.style.display = 'block';
                return;
            }

            fetch('/api/verify-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ link_code: currentLinkCode, password: password })
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Access Denied');
                return data;
            })
            .then(data => {
                document.getElementById('lockedSection').style.display = 'none';
                document.getElementById('unlockedSection').style.display = 'block';

                document.getElementById('fileName').innerText = data.name;
                if (data.item_type === 'file') {
                    const mb = (data.file_size / (1024 * 1024)).toFixed(2);
                    document.getElementById('fileMeta').innerText = `File Size: ${mb} MB`;
                    
                    const btn = document.getElementById('actionDownloadBtn');
                    btn.href = data.download_url;
                    btn.innerText = "Download File";

                    const preview = document.getElementById('mediaPreview');
                    if (data.mime_type.startsWith('image/')) {
                        preview.style.display = 'flex';
                        preview.innerHTML = `<img src="${data.download_url}" alt="Preview">`;
                    } else if (data.mime_type.startsWith('video/')) {
                        preview.style.display = 'flex';
                        preview.innerHTML = `<video controls src="${data.download_url}"></video>`;
                    }
                } else {
                    document.getElementById('fileMeta').innerText = "Verified Web Resource";
                    const btn = document.getElementById('actionDownloadBtn');
                    btn.href = data.download_url;
                    btn.innerText = "Proceed to Link";
                }
            })
            .catch(e => {
                err.innerText = e.message;
                err.style.display = 'block';
            });
        }
    </script>
</body>
</html>
